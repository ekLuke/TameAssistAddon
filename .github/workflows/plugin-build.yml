name: Build Valheim plugin (manual)

on:
  push:
    branches: [main]
    paths:
      - 'src/TameAssistAddon/**'
      - '.github/workflows/plugin-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare SteamCMD
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 curl unzip
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 3 https://media.steampowered.com/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
      - name: Install dedicated server (anonymous Steam app 896660)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/valheim"
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +force_install_dir "$RUNNER_TEMP/valheim" \
              +login anonymous +app_update 896660 validate +quit && break
            echo "SteamCMD attempt $attempt failed; retrying..."
            sleep 15
          done
          test -f "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Download BepInExPack Valheim
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bep"
          curl -fL --retry 3 \
            https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2360/ \
            -o "$RUNNER_TEMP/bepinex.zip"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$RUNNER_TEMP/bep"
          core=$(find "$RUNNER_TEMP/bep" -type f -name BepInEx.dll -print -quit)
          test -n "$core"
          mkdir -p "$RUNNER_TEMP/valheim/BepInEx/core"
          cp -a "$(dirname "$core")/." "$RUNNER_TEMP/valheim/BepInEx/core/"
      - name: Build plugin against latest dedicated-server assemblies
        shell: bash
        run: |
          dotnet build src/TameAssistAddon/TameAssistAddon.csproj \
            -c Release -p:ValheimDir="$RUNNER_TEMP/valheim"
      - name: Upload experimental (not production-tested) artifact
        uses: actions/upload-artifact@v4
        with:
          name: TameAssistAddon-0.3.0-experimental
          path: |
            src/TameAssistAddon/bin/Release/netstandard2.1/TameAssistAddon.dll
            src/TameAssistAddon/bin/Release/netstandard2.1/TameAssistAddon.Core.dll
          if-no-files-found: error

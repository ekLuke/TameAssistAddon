name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build deterministic simulation core
        run: dotnet build src/TameAssistAddon.Core/TameAssistAddon.Core.csproj --configuration Release --warnaserror
      - name: Run regression tests
        run: dotnet run --project tests/TameAssistAddon.Core.Tests/TameAssistAddon.Core.Tests.csproj --configuration Release

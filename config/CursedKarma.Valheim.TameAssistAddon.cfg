## TameAssistAddon 0.5.22 — server-only test configuration
## Install: BepInEx/config/CursedKarma.Valheim.TameAssistAddon.cfg
## Requires ServersideQoL and ServersideQoL.TameAssist for chest feeding.
## No coordinates, no rectangle, and no automatic offline world writes.
## The automatic pen recognition is still diagnostic-only.

[BoarBirths]
## For tamed boars in loaded zones, make babies spawn near parents.
BirthAtParent = true
## Move recent baby boars between nearby tamed parents.
PlaceNewbornBetweenParents = true
## Only relocate newborns this many seconds after spawning.
NewbornSeconds = 20
## Detailed logs for newborn corrections.
DebugLog = false

[Diagnostics]
## Log legacy boar census.
Enabled = true
## Log all tameable/breeding species (world-wide, read-only).
LogAllSpecies = true
## Detect 2D pen candidates including ZDO-closed vanilla doors; logs gate details (read-only).
AutoPenProbe = true

[General]
## Diagnostics interval in seconds; 60 limits world scan load.
TickIntervalSeconds = 60

[TamingChestFeed]
## Reuse upstream TameAssist for partly-tamed boars in loaded zones.
Enabled = true
## Retry only after this many seconds.
RetryIntervalSeconds = 5
## TEST WORLD ONLY. First chest meal for wild boars inside a closed 2D
## pen candidate without open/unknown gates. Remains disabled by default
## because authoritative 3D enclosure recognition is incomplete.
ExperimentalWildFirstFeed = false
## Explicit opt-in for the test world (replaces old Experimental acknowledgement).
ConfirmBackedUpTestWorld = true

[BarrierSigns]
## Server-only diagnostic signs with hammer/damage/refund protection.
## Automatically display a temporary vanilla sign
## on one nearby fence/barrier per detected candidate. Player-created signs
## on the same barrier replace the auto sign; empty ones get default info
## when there is no connected owner editing the sign.
Enabled = true
## Detailed created/updated/removed/overridden/empty-filled logs and protected RPC counters.
DebugLog = true

[RanchSlaughter]
## DIAGNOSTIC PREVIEW ONLY. Never kills, drops or removes animals.
PreviewEnabled = true
## Keep at least this many adult tamed breeding animals per species.
MinBreedersPerSpecies = 2
## Percentage of the detected enclosure's area usable by animals.
## Keep some space free for movement and feeding.
UsableAreaPercent = 80
## Approximate required m² for one adult of each species.
## All species share the SAME enclosure's area budget.
SquareMetersPerAdult = Boar:6,Wolf:9,Lox:28,Hen:2,Asksvin:18,Moose:25
## Hard upper bound on preview slaughter operations per scan.
MaxSlaughtersPerCycle = 2

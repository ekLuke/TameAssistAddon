## TameAssistAddon 0.5.12 — server-only test configuration
## Install: BepInEx/config/CursedKarma.Valheim.TameAssistAddon.cfg
## Requires ServersideQoL and ServersideQoL.TameAssist for chest feeding.
## No coordinates, no rectangle, and no automatic offline world writes.
## The automatic pen recognition is still diagnostic-only.

[BoarBirths]
## For tamed boars in loaded zones, make babies spawn near parents.
BirthAtParent = true
## Move recent baby boars between nearby tamed parents.
PlaceNewbornBetweenParents = true
## Only relocate newborns this many seconds after spawning.
NewbornSeconds = 20
## Detailed logs for newborn corrections.
DebugLog = false

[Diagnostics]
## Log legacy boar census.
Enabled = true
## Log all tameable/breeding species (world-wide, read-only).
LogAllSpecies = true
## Detect 2D pen candidates from fences and animal ZDOs (read-only).
AutoPenProbe = true

[General]
## Diagnostics interval in seconds; 60 limits world scan load.
TickIntervalSeconds = 60

[TamingChestFeed]
## Reuse upstream TameAssist for partly-tamed boars in loaded zones.
Enabled = true
## Retry only after this many seconds.
RetryIntervalSeconds = 5
## Explicit opt-in for the test world (replaces old Experimental acknowledgement).
ConfirmBackedUpTestWorld = true
